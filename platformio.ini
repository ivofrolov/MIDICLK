; PlatformIO Project Configuration File
; See https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = debug

[env]
platform = atmelavr
board = attiny85
board_build.f_cpu = 8000000L
board_fuses.efuse = 0xFF ; default
board_fuses.hfuse = 0xDF ; default
board_fuses.lfuse = 0xE2 ; clock divide by 8 disabled
board_fuses.lock_bits = 0xFF
upload_port = usb
upload_protocol = usbasp
extra_scripts = adjust_toolchain.py

[env:debug]
build_flags = -D DEBUG

[env:release]
board_fuses.hfuse = 0x5F ; WARNING: reset disabled
